services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot
      POSTGRES_DB: copilot
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot"]
      interval: 5s
      retries: 10

  api:
    build: ..
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://copilot:copilot@db:5432/copilot
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]
    volumes: ["../data:/app/data"]

  ui:
    build: ..
    command: ["streamlit", "run", "src/job_copilot/ui/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    environment:
      API_URL: http://api:8000
    depends_on: [api]
    ports: ["8501:8501"]

volumes:
  pgdata:
